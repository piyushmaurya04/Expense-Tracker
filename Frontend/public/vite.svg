<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circular background -->
  <circle cx="32" cy="32" r="30" fill="url(#gradientBg)"/>
  <!-- Dollar sign -->
  <text x="32" y="46" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="white" text-anchor="middle">$</text>
  <!-- Decorative circle outline -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>